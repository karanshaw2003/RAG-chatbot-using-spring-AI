spring.application.name=rag-chatbot

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=raguser
spring.datasource.password=${RAG_DB_PASSWORD:ragpass123}

# Initialize the Spring AI vector-store schema
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Chat model
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b

# Embedding model
spring.ai.ollama.embedding.model=nomic-embed-text
